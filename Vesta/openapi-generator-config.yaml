# swift-openapi-generator (build-tool plugin) configuration.
# Reads ./openapi.json (the pinned copy of hestia's emitted spec) and emits
# Swift types + a URLSession-backed client at build time — nothing generated is
# committed. See README "Typed API pipeline".
generate:
  - types
  - client
accessModifier: internal
namingStrategy: idiomatic
typeOverrides:
  schemas:
    # Preserve required nullable fields that the generator drops from anyOf unions.
    AuthFeatures: AuthFeaturesWire
    MeCapabilities: MeCapabilitiesWire
    # The generator drops recurrence_id's required anyOf with a null branch.
    CalendarExpandedInstance: CalendarExpandedInstanceWire
    # Allow malformed instances to be skipped while preserving the page metadata.
    CalendarInstances: CalendarInstancesWire
