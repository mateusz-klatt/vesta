name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pick an iOS simulator
        run: |
          make setup
          id="$(scripts/ci-simulator.sh)"
          echo "Using simulator $id"
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      - name: Build & test
        run: make test
